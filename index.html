<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Magical Diwali Surprise ✨</title>
<meta name="description" content="A little surprise is waiting for you. Open it on a quiet Diwali night.">
<meta name="theme-color" content="#070820">
<meta property="og:title" content="A Little Surprise Is Waiting For You ✨">
<meta property="og:description" content="Someone special has prepared something magical for you...">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='48'%3E%F0%9F%AA%94%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body data-scene="intro">

<!-- ======= living night sky (always behind everything) ======= -->
<div id="world" aria-hidden="true">
  <div id="sky"></div>
  <canvas class="stars" id="st1"></canvas>
  <canvas class="stars" id="st2"></canvas>
  <canvas class="stars" id="st3"></canvas>
  <div id="shooting"></div>
  <div id="moon"><div class="halo"></div><div class="disc"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></div></div>
  <div id="clouds"><div class="cloud c-a"></div><div class="cloud c-b"></div><div class="cloud c-c"></div></div>
  <div id="dust"></div>
  <div id="horizon"></div>
  <svg id="city" preserveAspectRatio="xMidYMax slice"></svg>
  <svg id="lights" preserveAspectRatio="none"></svg>
  <div id="diyas"></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<canvas id="fx2" aria-hidden="true"></canvas>
<div id="decor" aria-hidden="true"></div>

<main id="stage">

  <!-- 1 · MAGICAL NIGHT -->
  <section class="scene" id="sc-intro" aria-labelledby="introTitle">
    <div class="center">
      <h1 id="introTitle" class="gold script-ish big" data-rich="✨ A Little Surprise Is Waiting For You ✨"></h1>
      <p class="sub" data-rich="Someone special has prepared something magical for you..."></p>
      <button class="btn primary pulse" id="btnBegin" type="button"><span>Begin</span> <b class="em">✨</b></button>
      <p class="tiny">Sound on for the full magic · you can pause it anytime 🎵</p>
    </div>
  </section>

  <!-- 2 · NAME -->
  <section class="scene" id="sc-name" aria-labelledby="nameTitle">
    <form class="center glass panel" id="nameForm" autocomplete="off" novalidate>
      <h2 id="nameTitle" class="gold head" data-rich="Before We Begin... Tell Me Your Name ❤️"></h2>
      <div class="field">
        <input id="nameInput" type="text" maxlength="24" placeholder="Enter Your Name Here..." aria-label="Your name" autocapitalize="words" enterkeyhint="go">
        <span class="field-glow"></span>
      </div>
      <p class="hint" id="nameHint" role="alert" aria-live="polite"></p>
      <button class="btn primary" id="btnUnlock" type="submit"><span>Unlock My Surprise</span> <b class="em">✨</b></button>
    </form>
  </section>

  <!-- name reveal -->
  <section class="scene" id="sc-reveal" aria-live="polite">
    <div class="center">
      <p class="kicker" data-rich="Welcome ✨"></p>
      <h2 class="gold name-big" id="revealName"></h2>
      <p class="sub" data-rich="Your night of lights begins..."></p>
    </div>
  </section>

  <!-- 3 · FIREWORKS PLAYGROUND -->
  <section class="scene" id="sc-play" aria-label="Fireworks playground">
    <div class="top-note"><p id="playNote" class="note glass-lite"></p></div>
    <div class="dock">
      <div class="chips" id="chips" role="radiogroup" aria-label="Choose a firework"></div>
      <div class="row">
        <button class="btn primary" id="btnCelebrate" type="button"><span>Celebrate Diwali</span> <b class="em">🎆</b></button>
        <button class="btn ghost" id="btnToCouple" type="button"><span>Continue</span> <b class="em">❤️</b></button>
      </div>
    </div>
  </section>

  <!-- 4 · COUPLE -->
  <section class="scene" id="sc-couple" aria-label="A romantic Diwali night">
    <div class="top-note"><p id="coupleNote" class="note big-note"></p></div>
    <div class="couple-wrap"><svg id="coupleSvg" viewBox="0 0 600 720" role="img" aria-label="Illustration of a couple in festive Indian clothes holding a diya on a moonlit terrace"></svg></div>
    <div class="dock slim"><button class="btn primary" id="btnToGift" type="button"><span>Continue</span> <b class="em">❤️</b></button></div>
  </section>

  <!-- 5 · GIFT -->
  <section class="scene" id="sc-gift" aria-labelledby="giftTitle">
    <div class="gift-head">
      <p class="kicker" id="giftFor"></p>
      <h2 id="giftTitle" class="gold head" data-rich="A Special Diwali Gift For You ❤️"></h2>
    </div>
    <div class="gift-area" id="giftArea">
      <div class="beam" id="beam"></div>
      <div class="glowball" id="glowball"></div>
      <div class="gift-stage" id="giftStage">
        <div class="gift-sway" id="giftSway">
          <div class="gbox" id="gbox">
            <div class="gb-body" id="gbBody"></div>
            <div class="gb-lid" id="gbLid"></div>
          </div>
        </div>
      </div>
      <div class="gifts" id="gifts" hidden>
        <button class="gcard" data-gift="letter" type="button" aria-label="Open the love letter"><span class="gic" data-ic="letter"></span><span class="gname">Love Letter</span><span class="gnew">tap</span></button>
        <button class="gcard" data-gift="roses" type="button" aria-label="Open the forever roses"><span class="gic" data-ic="rose"></span><span class="gname">Forever Roses</span><span class="gnew">tap</span></button>
        <button class="gcard" data-gift="promise" type="button" aria-label="Open the promise"><span class="gic" data-ic="heart"></span><span class="gname">A Promise</span><span class="gnew">tap</span></button>
      </div>
    </div>
    <div class="dock slim">
      <button class="btn primary pulse" id="btnOpenGift" type="button"><span>Open Your Gift</span> <b class="em">🎁</b></button>
      <button class="btn primary" id="btnToMessage" type="button" hidden><span>Continue</span> <b class="em">✨</b></button>
      <p class="tiny" id="giftHint" hidden></p>
    </div>
  </section>

  <!-- gift details overlay -->
  <section class="scene overlay" id="sc-gdetail" aria-modal="true" role="dialog" aria-label="Your gift">
    <div class="gd-inner">
      <div class="gd-art" id="gdArt"></div>
      <p class="gd-text" id="gdText"></p>
      <button class="btn ghost" id="btnGBack" type="button"><span>Back to my gifts</span> <b class="em">🎁</b></button>
    </div>
  </section>

  <!-- 6 · MESSAGE -->
  <section class="scene" id="sc-message" aria-label="Happy Diwali message">
    <div class="msg" id="msgBox">
      <p class="kicker" id="msgFor"></p>
      <h2 class="gold m1" id="m1"></h2>
      <h3 class="gold m2" id="m2"></h3>
      <p class="m3" id="m3"></p>
      <p class="m3" id="m4"></p>
      <p class="m5" id="m5"></p>
    </div>
    <div class="dock slim"><button class="btn primary" id="btnToFinale" type="button" hidden><span>Grand Finale</span> <b class="em">🎆</b></button></div>
  </section>

  <!-- 7 · FINALE -->
  <section class="scene" id="sc-finale" aria-label="Grand finale">
    <div class="giant-heart" id="giantHeart"><svg viewBox="0 0 100 92"><defs><radialGradient id="gh" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#ffd6e7"/><stop offset=".35" stop-color="#ff5c93"/><stop offset="1" stop-color="#b3124f"/></radialGradient></defs><path d="M50 88C20 64 3 46 3 27 3 14 13 5 25 5c10 0 20 6 25 16C55 11 65 5 75 5c12 0 22 9 22 22 0 19-17 37-47 61z" fill="url(#gh)"/></svg><i class="ring r1"></i><i class="ring r2"></i></div>
    <div class="fin" id="finBox">
      <p class="kicker" id="finFor"></p>
      <h2 class="gold f1" id="f1"></h2>
      <p class="f2" id="f2"></p>
      <p class="gold f3" id="f3"></p>
      <p class="f4" id="f4"></p>
    </div>
    <div class="dock slim" id="finDock" hidden>
      <button class="btn primary" id="btnMore" type="button"><span>More Fireworks</span> <b class="em">🎇</b></button>
      <button class="btn ghost" id="btnReplay" type="button"><span>Replay the Surprise</span> <b class="em">🪔</b></button>
    </div>
  </section>
</main>

<div id="flash" aria-hidden="true"></div>

<div id="ctrl" role="group" aria-label="Sound controls">
  <button id="btnMusic" type="button" aria-label="Play music" aria-pressed="false" title="Play / pause music"></button>
  <button id="btnMute" type="button" aria-label="Mute sound" aria-pressed="false" title="Mute / unmute"></button>
</div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#f3d58a;background:#070820;font:20px Georgia,serif;text-align:center;padding:24px">This little surprise needs JavaScript. Please open it in a modern browser ✨</p></noscript>

<script src="audio.js"></script>
<script src="fx.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
